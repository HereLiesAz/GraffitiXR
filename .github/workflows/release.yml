name: Release (build, sign, publish)

# Self-contained release: builds a SIGNED AAB and APK in THIS repo (where the signing, Google
# services, ARCore and Play secrets live) and publishes them. Publishing was centralized into
# HereLiesAz/workflows, but that repo does not hold GraffitiXR's secrets and GitHub cannot read
# secrets across repositories, so the central "Inject Google services" step failed on every push and
# nothing shipped. Building and publishing here, with this repo's own secrets, is the arrangement that
# worked before Sept 16.
#
# Deliberately NOT named release-aab.yml / release-apk.yml: those names are registered with the
# central workflow synchronizer, which rewrites them into trackers. This filename is unregistered, so
# it stays a real workflow.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - version.properties
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Play? (off = build + upload artifacts only)"
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publishing so run N commits its versionCode and persists version.properties before run
# N+1 starts. github.run_number is monotonic by run CREATION, not publication order; without this,
# two overlapping runs could reach Play out of order and the later-but-lower code would be rejected.
# cancel-in-progress: false — queue, never cancel a publish mid-flight.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # third_party/artoolkitx backs core/nativebridge's SphereSLAM/KPM tracker — the non-ARCore
          # standalone path. Without it the gitlink is empty, CMake builds inert stubs, and we would
          # publish a release with non-ARCore tracking silently disabled. android-ci.yml checks it out
          # the same way.
          submodules: recursive

      - name: Inject Google services
        env:
          # Preferred: the full, real google-services.json pasted as one secret.
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          # Fallback: placeholder template + individual values (used only if GOOGLE_SERVICES is unset).
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          if [ -n "${GOOGLE_SERVICES:-}" ]; then
            echo "Using full GOOGLE_SERVICES secret."
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          elif [ -f "app/google-services.json.template" ]; then
            echo "GOOGLE_SERVICES unset; injecting from template."
            sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
          else
            echo "::error::No GOOGLE_SERVICES secret and no template — cannot produce google-services.json."
            exit 1
          fi
          if [ -z "${ARCORE_API_KEY:-}" ]; then
            echo "::error::ARCORE_API_KEY secret is empty — a release with a blank ARCore key would ship non-functional AR."
            exit 1
          fi
          echo "ARCORE_API_KEY=$ARCORE_API_KEY" >> local.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          # app/build.gradle.kts omits the release signingConfig (and silently produces an UNSIGNED
          # build) when any of these is blank. Validate all three here so we never publish an
          # uninstallable unsigned APK to the GitHub release or hand Play an unsigned AAB.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "::error::KEYSTORE_RAW secret is empty — cannot produce a signed build."
            exit 1
          fi
          missing=""
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing — the build would be unsigned and unpublishable."
            exit 1
          fi
          echo "$KEYSTORE_RAW" | base64 -d > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64."
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s app/keystore.jks) bytes)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve package name and version
        id: meta
        run: |
          PKG=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Resolve CI versionCode
        id: vcode
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # app/build.gradle.kts reads CI_VERSION_CODE as the Android versionCode and, when it is set,
          # never rewrites the tracked version.properties — so the same commit builds the same code and
          # the persist step below has nothing to commit (which is what previously raced into a conflict).
          #
          # Play requires a strictly increasing code. Pre-centralization builds reached ~14731; nothing
          # has published since. The 1,000,000 floor clears that history with room to spare.
          #
          # run_number is monotonic but does NOT change on a re-run, so a re-run after Play already
          # accepted the bundle would rebuild the same code and be rejected. run_attempt advances on each
          # re-run, so include it: run_number*10 + (run_attempt-1) gives each attempt a distinct code
          # while staying monotonic across runs and far below the 2,100,000,000 ceiling (allows 9
          # attempts per run; run_number can reach ~209M before overflow).
          echo "ci_version_code=$((1000000 + RUN_NUMBER * 10 + (RUN_ATTEMPT - 1)))" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB + APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_VERSION_CODE: ${{ steps.vcode.outputs.ci_version_code }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: graffitixr-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify SphereSLAM native tracking is present
        # CMake silently stubs the KPM/SphereSLAM tracker (STATUS, not error) when third_party/artoolkitx
        # is absent, so a submodule hiccup could ship a release with non-ARCore tracking disabled. These
        # are the same checks android-ci.yml runs; fail the publish rather than ship a crippled build.
        run: |
          python3 tools/check_sphereslam_build_contract.py
          python3 tools/check_sphereslam_apk.py --variant release
          python3 tools/check_sphereslam_manifest.py --variant release

      - name: Resolve release version
        id: version
        run: |
          # The GitHub release is a moving per-minor pointer (latest-release-vMAJOR.MINOR). versionBuild
          # is no longer read here: with CI_VERSION_CODE set it stays at the tracked placeholder, so the
          # release notes use the actual built versionCode (steps.vcode) instead.
          echo "tag=latest-release-v$(grep -E '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ').$(grep -E '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')" >> "$GITHUB_OUTPUT"

      # Play first, GitHub release second. Publishing the public GitHub release before Play meant a Play
      # failure left the moving release advertising a build that never shipped to users; ordering Play
      # ahead makes a Play failure abort the job before the GitHub release is touched.
      - name: Publish AAB to Google Play
        id: play-upload
        # Only main publishes. A workflow_dispatch run on a feature branch builds and uploads the
        # artifact above but must not mint a Play upload or a public release against this repo's codes.
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          AAB_GLOB: app/build/outputs/bundle/release/*.aab
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth google-auth-httplib2 httplib2==0.15.0
          python .github/scripts/play_multitrack_publish.py

      - name: Fail loudly if Play upload didn't succeed
        if: ${{ always() && steps.play-upload.outcome != 'success' && steps.play-upload.outcome != 'skipped' }}
        run: |
          echo "::error title=Play upload failed::AAB did not land on all target tracks." >&2
          exit 1

      # Runs only after the Play upload step succeeded (a failed Play step fails the job and skips this),
      # so the public GitHub release never advertises a build Play rejected. No versionCode persistence
      # step: CI_VERSION_CODE comes from the run number, so the build never rewrites version.properties.
      - name: Publish APK to GitHub release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.vcode.outputs.ci_version_code }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          notes="Automated release build — versionCode ${VERSION_CODE} (${GITHUB_SHA})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Moving release already exists: refresh its notes to this build and replace the APK, so the
            # tag's metadata and asset track the latest build instead of staying frozen at the first run.
            gh release edit "$TAG" --notes "$notes"
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --title "$TAG" --notes "$notes" --latest
          fi
