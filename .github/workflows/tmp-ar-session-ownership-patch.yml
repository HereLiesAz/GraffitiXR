name: Temporary AR session ownership patch

on:
  push:
    branches:
      - 'fix/ar-session-ownership-wiring'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ar-session-ownership-wiring
          fetch-depth: 0

      - name: Apply exact lifecycle replacements
        run: python3 .github/scripts/tmp_patch_ar_session_ownership.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/ArViewModel.kt \
            feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - name: Run AR unit tests
        run: ./gradlew :feature:ar:testDebugUnitTest --no-daemon

      - name: Commit production wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/ArViewModel.kt \
            feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt
          git commit -m 'fix(ar): fail closed on session handoff timeout'
          git push origin HEAD:fix/ar-session-ownership-wiring
