name: Repair build and navigation

on:
  push:
    branches:
      - fix/build-conflicts-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/build-conflicts-20260911
          fetch-depth: 0

      - name: Resolve conflict debris and harden navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def choose_stashed(path: str) -> None:
              p = Path(path)
              s = p.read_text()
              out = []
              i = 0
              lines = s.splitlines(keepends=True)
              while i < len(lines):
                  if lines[i].startswith('<<<<<<< '):
                      i += 1
                      while i < len(lines) and not lines[i].startswith('======='):
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError(f'Unterminated conflict in {path}')
                      i += 1
                      chosen = []
                      while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                          chosen.append(lines[i])
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError(f'Unterminated conflict in {path}')
                      out.extend(chosen)
                      i += 1
                  else:
                      out.append(lines[i])
                      i += 1
              p.write_text(''.join(out))

          choose_stashed('feature/dashboard/src/test/java/com/hereliesaz/graffitixr/feature/dashboard/DashboardViewModelTest.kt')
          choose_stashed('core/data/src/test/java/com/hereliesaz/graffitixr/data/ProjectManagerTest.kt')

          p = Path('app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt')
          s = p.read_text()

          # Do not start consuming navigation events until NavHost has installed its graph.
          old = '''                LaunchedEffect(Unit) {\n                    dashboardViewModel.navigationEvents.collect { destination ->\n'''
          new = '''                LaunchedEffect(navController) {\n                    // NavController exists one composition before AzNavHost installs its graph.\n                    // Waiting for the first back-stack entry prevents cold-start events from\n                    // navigating during that gap (\"Navigation graph has not been set\").\n                    navController.currentBackStackEntryFlow.first()\n                    dashboardViewModel.navigationEvents.collect { destination ->\n'''
          if old not in s:
              raise RuntimeError('Navigation event collector pattern not found')
          s = s.replace(old, new, 1)

          # The Project > Load rail action can be tapped during the same first-frame gap.
          old = '''            azRailSubItem(id = "proj.load", hostId = "host.project", text = navStrings.load, color = navItemColor, shape = AzButtonShape.NONE, disabled = showLibrary) {\n                navController.navigate(LIBRARY_ROUTE) { launchSingleTop = true }\n            }\n'''
          new = '''            azRailSubItem(id = "proj.load", hostId = "host.project", text = navStrings.load, color = navItemColor, shape = AzButtonShape.NONE, disabled = showLibrary) {\n                lifecycleScope.launch {\n                    navController.currentBackStackEntryFlow.first()\n                    navController.navigate(LIBRARY_ROUTE) { launchSingleTop = true }\n                }\n            }\n'''
          if old not in s:
              raise RuntimeError('Project Load navigation pattern not found')
          s = s.replace(old, new, 1)

          # first() is intentionally used as a readiness barrier for the nav graph.
          marker = 'import kotlinx.coroutines.launch\n'
          if 'import kotlinx.coroutines.flow.first\n' not in s:
              if marker not in s:
                  raise RuntimeError('Coroutine import marker not found')
              s = s.replace(marker, marker + 'import kotlinx.coroutines.flow.first\n', 1)

          p.write_text(s)

          # Refuse to commit any surviving conflict marker anywhere in Kotlin sources.
          bad = []
          for root in ('app', 'core', 'feature', 'android_collaboration_module'):
              rp = Path(root)
              if not rp.exists():
                  continue
              for f in rp.rglob('*.kt'):
                  t = f.read_text(errors='ignore')
                  if '<<<<<<< ' in t or '\n=======\n' in t or '>>>>>>> ' in t:
                      bad.append(str(f))
          if bad:
              raise RuntimeError('Conflict markers remain: ' + ', '.join(bad))
          PY

      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt \
                  feature/dashboard/src/test/java/com/hereliesaz/graffitixr/feature/dashboard/DashboardViewModelTest.kt \
                  core/data/src/test/java/com/hereliesaz/graffitixr/data/ProjectManagerTest.kt
          git diff --cached --check
          git commit -m "fix: repair build conflicts and nav graph race"
          git push origin HEAD:fix/build-conflicts-20260911
