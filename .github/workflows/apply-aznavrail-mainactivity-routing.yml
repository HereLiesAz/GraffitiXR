name: Apply AzNavRail MainActivity routing
on:
  push:
    paths:
      - '.github/workflows/apply-aznavrail-mainactivity-routing.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current MainActivity callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt')
          s=p.read_text()

          # DashboardViewModel no longer exposes navigationTrigger. Remove the obsolete observer/bridge if present.
          s=s.replace('                val dashboardNavigation by dashboardViewModel.navigationTrigger.collectAsState()\n', '', 1)
          start=s.find('                LaunchedEffect(dashboardNavigation) {')
          if start >= 0:
              marker='\n\n                LaunchedEffect(navController) {'
              end=s.find(marker,start)
              if end < 0: raise SystemExit('dashboard navigation bridge end not found')
              s=s[:start]+s[end+2:]

          old='                                            dashboardViewModel.openProject(project)\n'
          new='''                                            dashboardViewModel.openProject(project) {
                                                showSettings = false
                                                navController.navigate(EditorMode.DESIGN.name) {
                                                    popUpTo(LIBRARY_ROUTE) { inclusive = true }
                                                    launchSingleTop = true
                                                }
                                            }
'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'dashboardViewModel.openProject(project) {' not in s:
              raise SystemExit('project open callback not found')

          old='''                                    onSaveRequest = { name ->
                                        dashboardViewModel.onCreateProject(name)
                                    },'''
          new='''                                    onSaveRequest = { name ->
                                        dashboardViewModel.onCreateProject(name) {
                                            showSettings = false
                                            navController.navigate(EditorMode.DESIGN.name) {
                                                popUpTo(LIBRARY_ROUTE) { inclusive = true }
                                                launchSingleTop = true
                                            }
                                        }
                                    },'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'dashboardViewModel.onCreateProject(name) {' not in s:
              raise SystemExit('new project callback not found')

          p.write_text(s)
          PY
          git diff --check
          ! grep -q 'dashboardNavigation' app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt
          ! grep -q 'navigationTrigger' app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt
          grep -q 'dashboardViewModel.openProject(project) {' app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt
          grep -q 'dashboardViewModel.onCreateProject(name) {' app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'Source already repaired.'
            exit 0
          fi
          git commit -m 'Fix project routing through AzNavRail host controller'
          git pull --rebase origin main
          git push origin HEAD:main
