name: Temporary AR session KDoc fix

on:
  push:
    branches:
      - 'fix/ar-session-ownership-wiring'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ar-session-ownership-wiring
          fetch-depth: 0

      - name: Apply exact KDoc correction
        run: python3 .github/scripts/tmp_fix_ar_session_kdoc.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = 'feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt'

      - name: Commit KDoc correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt
          git commit -m 'docs(ar): correct session handoff timeout contract'
          git push origin HEAD:fix/ar-session-ownership-wiring
