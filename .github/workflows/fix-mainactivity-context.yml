name: Apply MainActivity context fix

on:
  push:
    paths:
      - '.github/workflows/fix-mainactivity-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt')
          s = p.read_text()
          old = 'Toast.makeText(context, it, Toast.LENGTH_LONG).show()'
          new = 'Toast.makeText(shareToastContext, it, Toast.LENGTH_LONG).show()'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one project-error toast context call, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-mainactivity-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hereliesaz/graffitixr/MainActivity.kt .github/workflows/fix-mainactivity-context.yml
          git commit -m 'fix: use scoped context for project error toast'
          git push
