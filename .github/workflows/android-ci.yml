name: Android CI

# GraffitiXR's canonical CI/release pipeline: runs unit tests on every push/PR, then builds and
# publishes the `latest-debug-vX.Y` debug-APK release on push to main only — a feature-branch push
# must never replace the public build.
# This is the ONLY workflow that tags/publishes that release — .github/workflows/merged-build.yml
# builds and tests the same code but deliberately does not touch the shared release tag, so the
# two workflows never race each other over it (see git history for the incident that caused this
# split).
#
# Auto-detects app name from settings.gradle.kts / settings.gradle.
# Reads version from version.properties (Major.Minor.Patch.Build).
#
# Required secrets (all optional — build falls back to debug key / skips injection):
#   KEYSTORE_RAW             — base64-encoded release keystore (.jks)
#   KEYSTORE_PASSWORD        — keystore password
#   KEY_ALIAS                — key alias inside the keystore
#   KEY_PASSWORD             — key password
# (The crash-report credential is NOT a CI secret: the artist enters it in Settings and it lives only
#  on-device, never in the APK. See SettingsRepository.crashReportToken.)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive CI versionCode
        # Above every versionCode published from version.properties (14730 at the switch), and
        # monotonic per workflow. Read by app/build.gradle.kts; version.properties is not rewritten.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Native lock discipline
        # tools/check_native_locking.py: every plain MobileGS member access must sit under a
        # MobileGS-owned lock (gEngineMutex is a shared_mutex and no longer serialises them).
        run: python3 tools/check_native_locking.py

      - name: SphereSLAM architecture invariants
        run: python3 tools/check_sphereslam_architecture.py

      - name: SphereSLAM build contract
        run: python3 tools/check_sphereslam_build_contract.py

      - name: Run detekt
        # config/detekt/detekt.yml (maxIssues: 0) existed but was never wired into CI, so it was
        # never actually enforced. continue-on-error is deliberate here: the detekt Gradle plugin
        # version hasn't been verified clean against this project's Kotlin/AGP versions in CI, so
        # this reports findings without hard-failing the build until that's confirmed. Tighten to
        # a hard failure (drop continue-on-error) once a clean run is verified.
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew detekt --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  release-build:
    # The shipped variant: minify + shrink + proguard keep rules (incl. JNI reflection) and the
    # android.r8.forceDisableFullMode workaround were never exercised by CI, so an R8 break that
    # strips a JNI method would reach users unnoticed. Unsigned here (no keystore needed); this
    # proves the release variant builds, including the embedded artoolkitX/KPM native path.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Derive CI versionCode
        # Above every versionCode published from version.properties (14730 at the switch), and
        # monotonic per workflow. Read by app/build.gradle.kts; version.properties is not rewritten.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon --stacktrace

      - name: Verify SphereSLAM release packaging
        run: python3 tools/check_sphereslam_apk.py --variant release

      - name: Verify non-ARCore release manifest
        run: python3 tools/check_sphereslam_manifest.py --variant release

  build-and-release:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Derive CI versionCode
        # Above every versionCode published from version.properties (14730 at the switch), and
        # monotonic per workflow. Read by app/build.gradle.kts; version.properties is not rewritten.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "::warning::KEYSTORE_RAW secret is empty — building with the default debug key."
            exit 0
          fi
          echo "$KEYSTORE_RAW" | base64 -d > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64."
            exit 1
          fi
          echo "Keystore decoded to app/keystore.jks ($(stat -c%s app/keystore.jks) bytes)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No crash-report token is injected: the crash-report credential is entered by the artist in
          # Settings and lives only on-device, never in the APK (see SettingsRepository.crashReportToken).
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Verify SphereSLAM debug packaging
        if: success()
        run: python3 tools/check_sphereslam_apk.py --variant debug

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
              body: `**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });

      - name: Prepare Release Variables
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_vars
        run: |
          MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER="${CI_VERSION_CODE}"
          VERSION_NAME="$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER"
          TAG_NAME="latest-debug-v${MAJOR}.${MINOR}"
          if [ -f "settings.gradle.kts" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          elif [ -f "settings.gradle" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          else
            APP_NAME="App"
          fi
          APK_ORIGINAL=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: No APK found to release!"
            exit 1
          fi
          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-debug.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$TARGET_NAME" >> $GITHUB_ENV
          mkdir -p build_tools_package/tools build_tools_package/native
          [ -d "app/src/main/assets/tools" ] && cp -r app/src/main/assets/tools/* build_tools_package/tools/ || true
          [ -d "app/src/main/jniLibs/arm64-v8a" ] && cp -r app/src/main/jniLibs/arm64-v8a/* build_tools_package/native/ || true
          cd build_tools_package && zip -r ../build-tools.zip . && cd ..

      - name: Publish Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa $TAG_NAME -m "Latest Debug Build"
          git push origin $TAG_NAME --force
          BUILD_TOOLS="build-tools.zip"
          if gh release view $TAG_NAME > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release delete-asset "$TAG_NAME" "$BUILD_TOOLS" -y || true
            gh release edit $TAG_NAME --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA" \
              --target $GITHUB_SHA
            gh release upload $TAG_NAME "$APK_FILE" --clobber
            [ -f "$BUILD_TOOLS" ] && gh release upload $TAG_NAME "$BUILD_TOOLS" --clobber
          else
            echo "Creating new release..."
            gh release create $TAG_NAME "$APK_FILE" --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA" \
              --target $GITHUB_SHA
            [ -f "$BUILD_TOOLS" ] && gh release upload $TAG_NAME "$BUILD_TOOLS" --clobber
          fi
