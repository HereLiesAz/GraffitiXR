name: Android CI

# GraffitiXR's CI: on every PR into main it runs the unit tests and native/architecture/detekt
# gates, proves the minified release variant builds, and builds the debug APK. It publishes nothing.
# Builds on merge to main — the signed AAB/APK, Google Play and the GitHub release — belong to the
# central HereLiesAz/workflows Android Play / GitHub Release workflows, not to this repository.
#
# Required secrets: none. Debug builds use the default debug key.
# (The crash-report credential is NOT a CI secret: the artist enters it in Settings and it lives only
#  on-device, never in the APK. See SettingsRepository.crashReportToken.)

on:
  # PRs into main only. The merge itself is built by the central workflows repo.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  # PR pushes cancel only their own earlier run (a newer commit supersedes it).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Native lock discipline
        # tools/check_native_locking.py: every plain MobileGS member access must sit under a
        # MobileGS-owned lock (gEngineMutex is a shared_mutex and no longer serialises them).
        run: python3 tools/check_native_locking.py

      - name: Native host unit tests
        # core/nativebridge's production C++ (MobileGS, the JNI frame-buffer
        # guards) compiled for the runner against OpenCV 4 + GoogleTest: the known-answer pose and
        # doodle-state tests BACKLOG Phase 7 had no way to run. NDK-side, not Kotlin.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libopencv-dev libgtest-dev
          tools/run_native_host_tests.sh

      - name: SphereSLAM architecture invariants
        run: python3 tools/check_sphereslam_architecture.py

      - name: SphereSLAM build contract
        run: python3 tools/check_sphereslam_build_contract.py

      - name: Run detekt
        # Enforced: config/detekt/detekt.yml (maxIssues: 0) fails the job on any finding.
        run: |
          chmod +x gradlew
          ./gradlew detekt --continue --build-cache --no-daemon --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  release-build:
    # The shipped variant: minify + shrink + proguard keep rules (incl. JNI reflection) and the
    # android.r8.forceDisableFullMode workaround were never exercised by CI, so an R8 break that
    # strips a JNI method would reach users unnoticed. Unsigned here (no keystore needed); this
    # proves the release variant builds, including the embedded artoolkitX/KPM native path.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon --stacktrace

      - name: Verify SphereSLAM release packaging
        run: python3 tools/check_sphereslam_apk.py --variant release

      - name: Verify non-ARCore release manifest
        run: python3 tools/check_sphereslam_manifest.py --variant release

  build-and-release:
    # Runs after both gates; builds the debug APK. (Job id kept: it is the check name PRs report.)
    needs: [unit-tests, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No crash-report token is injected: the crash-report credential is entered by the artist in
          # Settings and lives only on-device, never in the APK (see SettingsRepository.crashReportToken).
          # No signing secrets: assembleDebug always uses the default debug key (app/build.gradle.kts
          # never signs debug builds with the production key); only the central release workflows
          # decode the keystore.
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Verify SphereSLAM debug packaging
        if: success()
        run: python3 tools/check_sphereslam_apk.py --variant debug

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            const title = `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            // Dedupe: skip creating a second issue when an open one with this title already exists.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'jules,bug', per_page: 100,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`An open "${title}" issue already exists; not creating a duplicate.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });
