name: Android CI

# GraffitiXR's CI: on every PR into main and every push to main it runs the unit tests and native/
# architecture/detekt gates and proves the minified release variant builds; on push to main only it
# then publishes the `latest-debug-vX.Y` debug-APK prerelease — a PR must never replace the public
# build. The signed release AAB/APK and Play publishing are NOT here: they live in release.yml.
# This is the ONLY workflow that tags/publishes that release — .github/workflows/merged-build.yml
# builds and tests the same code but deliberately does not touch the shared release tag, so the
# two workflows never race each other over it (see git history for the incident that caused this
# split).
#
# Auto-detects app name from settings.gradle.kts / settings.gradle.
# Debug APK is named Major.Minor.Patch.Build: the shared version contract's version for the pushed
# commit (.github/scripts/contract_version.py) — the app's versionName.
#
# Required secrets: none. The published debug APK is always signed with the default debug key
# (app/build.gradle.kts never uses the production key for debug builds), so this workflow does not
# decode KEYSTORE_RAW. Release signing and Play publishing live in .github/workflows/release.yml.
# (The crash-report credential is NOT a CI secret: the artist enters it in Settings and it lives only
#  on-device, never in the APK. See SettingsRepository.crashReportToken.)

on:
  # PRs into main, and the merge itself. Plain branch pushes don't run it, so a PR commit
  # triggers exactly one event.
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  # PR pushes cancel only their own earlier run (a newer commit supersedes it). Main pushes and
  # manual dispatches share one lane and QUEUE rather than cancel: cancelling a publish between
  # `gh release upload` and the tag/notes update leaves the release carrying one commit's APK
  # under another commit's tag. A PR event never shares a lane with main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive CI versionCode
        # Debug-only versionCode, monotonic per workflow; release.yml takes its code from Play.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Native lock discipline
        # tools/check_native_locking.py: every plain MobileGS member access must sit under a
        # MobileGS-owned lock (gEngineMutex is a shared_mutex and no longer serialises them).
        run: python3 tools/check_native_locking.py

      - name: Native host unit tests
        # core/nativebridge's production C++ (MobileGS, the JNI frame-buffer
        # guards) compiled for the runner against OpenCV 4 + GoogleTest: the known-answer pose and
        # doodle-state tests BACKLOG Phase 7 had no way to run. NDK-side, not Kotlin.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libopencv-dev libgtest-dev
          tools/run_native_host_tests.sh

      - name: SphereSLAM architecture invariants
        run: python3 tools/check_sphereslam_architecture.py

      - name: SphereSLAM build contract
        run: python3 tools/check_sphereslam_build_contract.py

      - name: Run detekt
        # Enforced: config/detekt/detekt.yml (maxIssues: 0) fails the job on any finding.
        run: |
          chmod +x gradlew
          ./gradlew detekt --continue --build-cache --no-daemon --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  release-build:
    # The shipped variant: minify + shrink + proguard keep rules (incl. JNI reflection) and the
    # android.r8.forceDisableFullMode workaround were never exercised by CI, so an R8 break that
    # strips a JNI method would reach users unnoticed. Unsigned here (no keystore needed); this
    # proves the release variant builds, including the embedded artoolkitX/KPM native path.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive CI versionCode
        # Debug-only versionCode, monotonic per workflow; release.yml takes its code from Play.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon --stacktrace

      - name: Verify SphereSLAM release packaging
        run: python3 tools/check_sphereslam_apk.py --variant release

      - name: Verify non-ARCore release manifest
        run: python3 tools/check_sphereslam_manifest.py --variant release

  build-and-release:
    # Both gates: a debug APK is only published for a commit whose release variant also builds.
    needs: [unit-tests, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive CI versionCode
        # Debug-only versionCode, monotonic per workflow; release.yml takes its code from Play.
        # The versionName is version.properties verbatim (see app/build.gradle.kts).
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Resolve versionName from the version contract
        # A push to main is assigned its version by the contract bot after the push; the published
        # debug APK carries that version (see .github/scripts/contract_version.py). PRs keep the file's.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "CI_VERSION_NAME=$(python3 .github/scripts/contract_version.py "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No crash-report token is injected: the crash-report credential is entered by the artist in
          # Settings and lives only on-device, never in the APK (see SettingsRepository.crashReportToken).
          # No signing secrets: assembleDebug always uses the default debug key (app/build.gradle.kts
          # never signs debug builds with the production key), so the keystore is only decoded in
          # release.yml.
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Verify SphereSLAM debug packaging
        if: success()
        run: python3 tools/check_sphereslam_apk.py --variant debug

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            const title = `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            // Dedupe: android-ci.yml and merged-build.yml both run on every push and both report
            // failures, so skip creating a second issue when an open one with this title already exists.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'jules,bug', per_page: 100,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`An open "${title}" issue already exists; not creating a duplicate.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });

      - name: Prepare Release Variables
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_vars
        run: |
          # The app's versionName: the contract version of this commit (CI_VERSION_NAME, above).
          VERSION_NAME="$CI_VERSION_NAME"
          MAJOR=$(cut -d. -f1 <<<"$VERSION_NAME")
          MINOR=$(cut -d. -f2 <<<"$VERSION_NAME")
          TAG_NAME="latest-debug-v${MAJOR}.${MINOR}"
          if [ -f "settings.gradle.kts" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          elif [ -f "settings.gradle" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          else
            APP_NAME="App"
          fi
          APK_ORIGINAL=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: No APK found to release!"
            exit 1
          fi
          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-debug.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$TARGET_NAME" >> $GITHUB_ENV
          mkdir -p build_tools_package/tools build_tools_package/native
          [ -d "app/src/main/assets/tools" ] && cp -r app/src/main/assets/tools/* build_tools_package/tools/ || true
          [ -d "app/src/main/jniLibs/arm64-v8a" ] && cp -r app/src/main/jniLibs/arm64-v8a/* build_tools_package/native/ || true
          cd build_tools_package && zip -r ../build-tools.zip . && cd ..

      - name: Publish Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Order matters: the tag must never point at this commit while the release still carries the
        # previous commit's APK. Existing release: upload the new assets FIRST (--clobber replaces in
        # place), and only then force-move the tag and refresh the notes — a failed upload leaves the
        # old tag and old APK consistent. New release: the tag is pushed and the release created with
        # the APK in one call, so there is no earlier APK to disagree with.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUILD_TOOLS="build-tools.zip"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
            if [ -f "$BUILD_TOOLS" ]; then gh release upload "$TAG_NAME" "$BUILD_TOOLS" --clobber; fi
            git tag -fa "$TAG_NAME" -m "Latest Debug Build"
            git push origin "$TAG_NAME" --force
            gh release edit "$TAG_NAME" --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA"
          else
            echo "Creating new release..."
            git tag -fa "$TAG_NAME" -m "Latest Debug Build"
            git push origin "$TAG_NAME" --force
            gh release create "$TAG_NAME" "$APK_FILE" --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA"
            if [ -f "$BUILD_TOOLS" ]; then gh release upload "$TAG_NAME" "$BUILD_TOOLS" --clobber; fi
          fi
