name: ARCore 1.56 surgery

on:
  push:
    branches:
      - fix/arcore-156-adaptation

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[arcore-surgery]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcore-156-adaptation
          fetch-depth: 0

      - name: Patch renderer fail-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt')
          text = path.read_text()

          old_logic = '''                val anchorTracking = normalIsDegenerate || activeAnchorCount() > 0
                val giveUp = overlayRotationCorrectionRetryFrames >= MAX_OVERLAY_CORRECTION_RETRY_FRAMES
                val valid = anchorTracking && reproducesNormal

                if (valid || giveUp) {
                    if (giveUp && !valid) {
                        Timber.w(
                            "ARDIAG overlayRotationCorrection: accepting an unvalidated capture after " +
                                "$overlayRotationCorrectionRetryFrames retries " +
                                "(anchorTracking=$anchorTracking reproducesNormal=$reproducesNormal)"
                        )
                    }
                    System.arraycopy(overlayRotationCorrectionCandidate, 0, overlayRotationCorrection, 0, 16)
                    overlayRotationCorrectionPending = false
                    overlayRotationCorrectionRetryFrames = 0
                } else {
                    // Leave [overlayRotationCorrectionPending] set: retry against next frame's
                    // anchorMatrix, which is more likely to be the real anchor's own tracked pose.
                    // overlayRotationCorrection is untouched — it stays whatever it was (identity, on
                    // the very first attempt), which draws as "use the raw anchor frame" while retrying.
                    overlayRotationCorrectionRetryFrames++
                }
'''
          new_logic = '''                val anchorTracking = normalIsDegenerate || activeAnchorCount() > 0
                val valid = anchorTracking && reproducesNormal

                when (
                    decideOverlayRotationCorrection(
                        valid = valid,
                        retryFrames = overlayRotationCorrectionRetryFrames,
                        maxRetryFrames = MAX_OVERLAY_CORRECTION_RETRY_FRAMES,
                    )
                ) {
                    OverlayRotationCorrectionDecision.APPLY -> {
                        System.arraycopy(overlayRotationCorrectionCandidate, 0, overlayRotationCorrection, 0, 16)
                        overlayRotationCorrectionPending = false
                        overlayRotationCorrectionRetryFrames = 0
                    }
                    OverlayRotationCorrectionDecision.DISCARD -> {
                        Timber.w(
                            "ARDIAG overlayRotationCorrection: discarding invalid capture after " +
                                "$overlayRotationCorrectionRetryFrames retries " +
                                "(anchorTracking=$anchorTracking reproducesNormal=$reproducesNormal); " +
                                "keeping the existing/raw anchor orientation"
                        )
                        // Never promote a candidate that failed validation merely because time passed.
                        // Leaving overlayRotationCorrection untouched preserves the prior correction —
                        // identity on first establishment, i.e. the raw/live ARCore anchor frame.
                        overlayRotationCorrectionPending = false
                        overlayRotationCorrectionRetryFrames = 0
                    }
                    OverlayRotationCorrectionDecision.RETRY -> {
                        // Retry against next frame's anchorMatrix, which is more likely to be the real
                        // anchor's own tracked pose. The active correction remains untouched meanwhile.
                        overlayRotationCorrectionRetryFrames++
                    }
                }
'''

          old_destroy = '''            // anchorOrchestrator.clear() calls Anchor.detach() — a real ARCore native call — on this
            // (main) thread, so it needs the same best-effort serialization against onDrawFrame as
            // nulling `session` above, not a separate unlocked call afterwards. Kept inside this same
            // bounded try/finally rather than given its own lock attempt: best-effort and bounded
            // either way, since blocking here is the exact freeze this method's own doc says an
            // unconditional lock caused.
            anchorOrchestrator.clear()
'''
          new_destroy = '''            // clear() is deliberately Kotlin-state-only: it drops the orchestrator's retained
            // anchor references but never calls Anchor.detach(). That distinction is what makes this
            // teardown safe even when the bounded sessionLock acquisition above failed. Superseded
            // live-session anchors are detached from setInitialAnchor() on the serialized GL path.
            anchorOrchestrator.clear()
'''

          old_constant = '''        // Bound on how many frames [overlayRotationCorrectionPending] is retried while its candidate
        // fails validation (anchor not yet TRACKING, or a degenerate up-vector fallback), before it is
        // accepted anyway with a warning logged. At a typical 30-60fps this is well under a second —
        // long enough for a freshly-created anchor to reach TRACKING, short enough that a persistently
        // non-tracking anchor doesn't leave the artwork's orientation undecided for the rest of the
        // session.
'''
          new_constant = '''        // Bound on how many frames [overlayRotationCorrectionPending] is retried while its candidate
        // fails validation (anchor not yet TRACKING, or a degenerate up-vector fallback). At the
        // limit an invalid candidate is discarded and the existing correction is retained — identity
        // on first establishment, i.e. the raw/live anchor orientation. Time passing is not evidence.
'''

          replacements = (
              (old_logic, new_logic, 'rotation decision block'),
              (old_destroy, new_destroy, 'destroy comment'),
              (old_constant, new_constant, 'retry-budget comment'),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test AR feature under ARCore 1.56
        run: ./gradlew :feature:ar:testDebugUnitTest :feature:ar:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit tested renderer patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arcore-156-surgery.yml
          git add feature/ar/src/main/java/com/hereliesaz/graffitixr/feature/ar/rendering/ArRenderer.kt
          git commit -m '[arcore-surgery] Fail safe rotation correction under ARCore 1.56'
          git push origin HEAD:fix/arcore-156-adaptation
