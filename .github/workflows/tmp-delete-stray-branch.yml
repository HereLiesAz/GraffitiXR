name: Temporary stray branch cleanup

on:
  push:
    branches:
      - 'fix/ar-rotation-timeout-discard'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete accidental branch
        run: git push origin --delete noop-should-not-create
