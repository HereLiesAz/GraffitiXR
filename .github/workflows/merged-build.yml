name: Merged Build & Release

# Build + unit-test verification workflow. This workflow does NOT own the shared
# `latest-debug-vX.Y` release tag/GitHub Release — `.github/workflows/android-ci.yml`
# is the canonical publisher of that tag. Having both workflows tag-and-release on every
# push raced them against each other and corrupted the release; see the audit that led to
# this split. If this workflow needs to publish again, coordinate with android-ci.yml
# first so only one workflow ever force-pushes the tag.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          # `test` already includes the debug unit-test tasks; running both `testDebugUnitTest`
          # and `test` duplicated work and could leave Gradle workers alive indefinitely in CI.
          # Disable the persistent daemon and give the job a hard timeout above so a broken test
          # can never pin the release pipeline forever.
          #
          # Note: this intentionally tests every module, including :feature:ar (ArViewModel /
          # ArRenderer / SLAM logic) — a previous version of this line excluded that module with
          # no explanation, which meant this workflow and android-ci.yml disagreed on what
          # "unit tests passed" means. Keep them in agreement.
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  build:
    # Builds and smoke-tests the debug APK. Deliberately does NOT tag or publish a
    # release — see the header note at the top of this file.
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "::warning::KEYSTORE_RAW secret is empty — building with the default debug key."
            exit 0
          fi
          echo "$KEYSTORE_RAW" | base64 -d > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64."
            exit 1
          fi
          echo "Keystore decoded to app/keystore.jks ($(stat -c%s app/keystore.jks) bytes)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
              body: `**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });
