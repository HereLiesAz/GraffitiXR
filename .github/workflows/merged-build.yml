name: Merged Build & Release

# Build + unit-test verification workflow. This workflow does NOT own the shared
# `latest-debug-vX.Y` release tag/GitHub Release — `.github/workflows/android-ci.yml`
# is the canonical publisher of that tag. Having both workflows tag-and-release on every
# push raced them against each other and corrupted the release; see the audit that led to
# this split. If this workflow needs to publish again, coordinate with android-ci.yml
# first so only one workflow ever force-pushes the tag.

on:
  # PRs into main, and the merge itself. Plain branch pushes don't run it, so a PR commit
  # triggers exactly one event.
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  # PR pushes cancel only their own earlier run (a newer commit supersedes it). Main pushes and
  # manual dispatches share one lane and queue instead of cancelling each other, so every merged
  # commit gets its own build verdict. A PR event never shares a lane with main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive CI versionCode
        # Debug-only versionCode, monotonic per workflow; release.yml takes its code from Play.
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          # `test` already includes the debug unit-test tasks; running both `testDebugUnitTest`
          # and `test` duplicated work and could leave Gradle workers alive indefinitely in CI.
          # Disable the persistent daemon and give the job a hard timeout above so a broken test
          # can never pin the release pipeline forever.
          #
          # Note: this intentionally tests every module, including :feature:ar (ArViewModel /
          # ArRenderer / SLAM logic) — a previous version of this line excluded that module with
          # no explanation, which meant this workflow and android-ci.yml disagreed on what
          # "unit tests passed" means. Keep them in agreement.
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Native lock discipline
        # tools/check_native_locking.py: every plain MobileGS member access must sit under a
        # MobileGS-owned lock (gEngineMutex is a shared_mutex and no longer serialises them).
        run: python3 tools/check_native_locking.py

      - name: Native host unit tests
        # core/nativebridge's production C++ (MobileGS, the JNI frame-buffer
        # guards) compiled for the runner against OpenCV 4 + GoogleTest: the known-answer pose and
        # doodle-state tests BACKLOG Phase 7 had no way to run. NDK-side, not Kotlin.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libopencv-dev libgtest-dev
          tools/run_native_host_tests.sh

      - name: SphereSLAM architecture invariants
        run: python3 tools/check_sphereslam_architecture.py

      - name: SphereSLAM build contract
        run: python3 tools/check_sphereslam_build_contract.py

      - name: Run detekt
        # Enforced: config/detekt/detekt.yml (maxIssues: 0) fails the job on any finding.
        run: |
          chmod +x gradlew
          ./gradlew detekt --continue --build-cache --no-daemon --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  build:
    # Builds and smoke-tests the debug APK. Deliberately does NOT tag or publish a
    # release — see the header note at the top of this file.
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive CI versionCode
        # Debug-only versionCode, monotonic per workflow; release.yml takes its code from Play.
        # The versionName is version.properties verbatim (see app/build.gradle.kts).
        run: echo "CI_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No crash-report token is injected: the crash-report credential is entered by the artist in
          # Settings and lives only on-device, never in the APK (see SettingsRepository.crashReportToken).
          # No signing secrets: assembleDebug always uses the default debug key (app/build.gradle.kts
          # never signs debug builds with the production key), so the keystore is only decoded in
          # release.yml.
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            const title = `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            // Dedupe: android-ci.yml and merged-build.yml both run on every push and both report
            // failures, so skip creating a second issue when an open one with this title already exists.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'jules,bug', per_page: 100,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`An open "${title}" issue already exists; not creating a duplicate.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });
