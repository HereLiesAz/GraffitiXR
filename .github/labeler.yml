# Configuration for the Labeler Action

# Label 'documentation' for changes in docs/ or markdown files
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

# Label 'feature' for changes in feature modules
feature:
  - changed-files:
      - any-glob-to-any-file:
          - 'feature/**'

# Label 'core' for changes in core modules
core:
  - changed-files:
      - any-glob-to-any-file:
          - 'core/**'

# Label 'native' for changes in C++ code
native:
  - changed-files:
      - any-glob-to-any-file:
          - 'core/nativebridge/src/main/cpp/**'

# Label 'build' for gradle files
build:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.gradle.kts'
          - '**/*.gradle'

# Label 'collab' for the collaboration module (Gradle path :android_collaboration_module,
# directory collab/ -- the mismatch between the two is a known inconsistency, tracked
# separately; this rule just makes sure PRs touching the module still get labeled).
collab:
  - changed-files:
      - any-glob-to-any-file:
          - 'collab/**'
