# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of libraries
android.nonTransitiveRClass=true

# CRITICAL FIX: The Navigation Component (ProcessNavigationXmlTask) is incompatible
# with the Configuration Cache in AGP 9.0+. We must disable it to prevent serialization crashes.
org.gradle.configuration-cache=false

# ARCORE FIX: originally written against ARCore 1.53.0 and AGP 9.1.0, which shipped internal
# obfuscated classes (e.g. com.google.ar.core.x) that R8/D8 failed to handle correctly when it
# tried to "verify" or repackage them. The legacy flag
# 'android.enableDexingArtifactTransform.forExternalLibs' was obsolete in AGP 9.1.0, so instead
# this disables aggressive repackaging and R8 Full Mode.
# The project is now on ARCore 1.56.0 and AGP 9.4.0 (see gradle/libs.versions.toml); whether this
# workaround is still needed at those versions has NOT been re-verified — treat it as a candidate
# for removal once someone can test a build without it.
android.r8.forceDisableFullMode=true

# KOTLIN METADATA FIX: Suppress built-in kotlin source set issue.
android.disallowKotlinSourceSets=false
