distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# NOTE: no distributionSha256Sum is set, so only the URL's well-formedness is validated
# (validateDistributionUrl=true), not the downloaded distribution's actual contents. The correct
# SHA-256 for gradle-9.7.1-bin.zip needs to be filled in here by someone who can verify it against
# https://gradle.org/release-checksums/ (or an equivalent trusted source) -- not guessed, since a
# wrong hash would hard-fail every build.
networkTimeout=10000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
